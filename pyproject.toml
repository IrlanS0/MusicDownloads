[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remessa-musicas"
version = "0.1.0"
description = "Gerenciador de remessas de audio no terminal"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "yt-dlp[default]>=2026.1"]

[project.scripts]
music = "remessa_musicas.cli:main"
musics = "remessa_musicas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
